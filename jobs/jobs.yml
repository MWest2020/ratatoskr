# Recurring jobs — geplande claude -p-taken die naar een kanaal posten.
# Elk job: kanaal-id, post-identiteit (handle, nsec via SOPS), prompt, en een
# optioneel context_cmd (shell op de host; stdout wordt context voor claude -p).
# Het schema staat in de bijbehorende systemd-timer, niet hier.

jobs:
  news_from_zettelkast:
    channel: 1c0566f6-a6ae-485f-8920-81767f09b350
    identity: orchestrator
    prompt: |
      Maak een korte, eerlijke "nieuws uit de zettelkast"-digest voor Mark op
      basis van de context hieronder (recente journal-entries + laatste
      funding-memo). Noem 3-6 concrete punten: wat is er gebeurd, welke
      funding/kansen zijn relevant, en wat vraagt aandacht. Kort, Nederlands,
      geen opsmuk. Begin met "🗞️ Zettelkast-digest".
    context_cmd: |
      git -C /home/agent/zettelkast log --oneline -12 2>/dev/null
      echo '--- laatste funding-memo ---'
      f=$(ls -t /home/agent/zettelkast/memos/*funding* 2>/dev/null | head -1)
      [ -n "$f" ] && sed -n '1,45p' "$f"

  proposals:
    channel: e9150354-ee43-49d7-83a6-290602766a74
    identity: orchestrator
    prompt: |
      Vat de OPEN OpenSpec-proposals uit het ecosysteem samen (context = de
      niet-gearchiveerde proposal.md's). Per proposal: repo, naam, en in één zin
      waar het over gaat. Groepeer per repo. Kort, Nederlands. Begin met
      "📋 Open proposals". Geen open proposals? Zeg dat.
    context_cmd: |
      for p in /home/agent/*/openspec/changes/*/proposal.md; do
        [ -f "$p" ] || continue
        repo=$(echo "$p" | sed 's#/home/agent/##; s#/openspec/.*##')
        ch=$(basename "$(dirname "$p")")
        why=$(grep -A1 -m1 '## Why' "$p" | tail -1 | cut -c1-90)
        echo "[$repo] $ch — $why"
      done 2>/dev/null | head -50

  technical_debt:
    channel: 2dd07372-b77a-4090-a06b-840fffc15f4c
    identity: architect
    prompt: |
      Je bent de architect. Reflecteer kort op technische schuld in het
      ecosysteem: waar bouwen we fast&clever op i.p.v. boring&auditable, welke
      afweging betaalt straks rente? Gebruik de recente journal-context. Noem
      1-3 concrete aandachtspunten met een suggestie. Kort, Nederlands. Begin
      met "🏗️ Technical-depth check".
    context_cmd: |
      git -C /home/agent/zettelkast log --oneline -10 2>/dev/null
      echo '--- boomhuis recente commits ---'
      git -C /home/agent/boomhuis log --oneline -8 2>/dev/null

  standup:
    channel: bd75be15-28ad-4243-8d2a-a15ed50826e6
    identity: orchestrator
    prompt: |
      Je bent de coördinator. Maak een korte ochtend-standup voor Mark uit de
      context: wat staat er OPEN (PR's die op merge wachten, open OpenSpec-changes)
      en wáár lopen we VAST (FAILs, blokkades, dingen die op Mark wachten). Max
      5-7 concrete punten, Nederlands, geen opsmuk. Begin met "☀️ Standup".
    context_cmd: |
      export BUZZ_PRIVATE_KEY="${NSEC_ORCHESTRATOR:-}"   # eigen sleutel, alleen om te LEZEN; gaat niet naar de output
      cid() { python3 -c "import yaml,sys;print(yaml.safe_load(open('/home/agent/boomhuis/channels.yml'))['channels']['$1']['id'])" 2>/dev/null; }
      # Een LEESFOUT (relay/auth/gh weg, of een onverwachte respons-shape) moet
      # ZICHTBAAR zijn, niet stil als "leeg" doorgaan — anders leest claude -p het
      # als "geen blokkades" (false-clear). Sorteer op created_at vóór de laatste N.
      rd() { "${BUZZ_BIN:-buzz}" messages get --channel "$1" 2>/dev/null | python3 -c "import sys,json; d=json.load(sys.stdin); print('(LEESFOUT: '+str(d.get('message') or d.get('error') or 'onverwachte respons')[:80]+')') if isinstance(d,dict) and (d.get('error') or 'messages' not in d) else [print((m.get('content') or '').replace(chr(10),' ')[:140]) for m in sorted((d if isinstance(d,list) else d.get('messages',[])), key=lambda m: m.get('created_at',0))[-$2:]]" 2>/dev/null || echo "(LEESFOUT: kanaal onbereikbaar — niet als 'geen blokkades' lezen)"; }
      echo '== blokkades / besluiten (#escalatie) =='
      rd "$(cid escalatie)" 6
      echo '== recente review-verdicts (#review) =='
      rd "$(cid review)" 5
      # Goedkope secties eerst, de dure PR-lijst laatst: bij de 6000-tekenskap in
      # run-job.py valt dan hooguit de staart van de PR-lijst weg, niet de rest.
      echo '== open OpenSpec-changes =='
      for p in /home/agent/*/openspec/changes/*/proposal.md; do
        [ -f "$p" ] || continue
        r=$(echo "$p" | sed 's#/home/agent/##; s#/openspec/.*##')
        echo "[$r] $(basename "$(dirname "$p")")"
      done 2>/dev/null | head -30
      echo '== open PRs — wachten op merge (MWest2020) =='
      # --json/--jq: een lege set geeft [] + exit 0 (geen output), alleen een echte
      # fout geeft non-zero → LEESFOUT. Zo telt "geen open PRs" niet als storing.
      gh search prs --owner=MWest2020 --state=open --limit 20 --json repository,number,title \
        --jq '.[] | "[\(.repository.name)] #\(.number) \(.title)"' 2>/dev/null \
        || echo "(LEESFOUT: kon open PR's niet ophalen — gh/netwerk?)"

  gedaan:
    channel: bd75be15-28ad-4243-8d2a-a15ed50826e6
    identity: orchestrator
    prompt: |
      Maak een korte "gedaan vandaag"-terugblik voor Mark uit de context (commits
      + gemergede PR's van vandaag). Groepeer per repo/thema, noem wat concreet af
      of vooruit is. Kort, Nederlands, geen opsmuk. Begin met "🌙 Gedaan vandaag".
      Staat er geen enkele commit of merge in de context? Geef dan een leeg antwoord
      (dan post er niks — een stille dag is geen ruis).
    context_cmd: |
      echo '== commits vandaag (lokale clones, alle branches) =='
      for d in /home/agent/*/; do
        [ -e "$d/.git" ] || continue
        git -C "$d" log --all --oneline --since=midnight 2>/dev/null | sed "s#^#[$(basename "$d")] #"
      done | head -60
      echo '== vandaag gemerged =='
      # --owner (niet 'org:', want MWest2020 is een user-account) + --json/--jq zodat
      # een lege set geen valse LEESFOUT geeft.
      gh search prs --owner=MWest2020 "merged:>=$(date +%F)" --limit 20 --json repository,number,title \
        --jq '.[] | "[\(.repository.name)] #\(.number) \(.title)"' 2>/dev/null \
        || echo "(LEESFOUT: kon merges niet ophalen — gh/netwerk?)"

  zettelkast_dagelijks:
    channel: 1c0566f6-a6ae-485f-8920-81767f09b350
    identity: orchestrator
    prompt: |
      Meld kort wat er vandaag met Marks gedeelde clips is gebeurd, op basis van
      de context. Drie stukjes, in deze volgorde:
      1. VERWERKT vandaag — wat is er gecaptured, naar welke pagina.
      2. OPEN — welke bronnen staan écht nog open (de context noemt ze los van de
         al afgehandelde), en wat zou ermee moeten.
      3. Eén zin: valt er iets op (een patroon, een share die niet ophaalde)?
      Staat er een LEESFOUT in de context, meld die dan expliciet — lees 'm NIET
      als "niets te doen". Is er vandaag niets verwerkt én niets open, geef dan
      een leeg antwoord (dan post er niks). Nederlands, kort, geen opsmuk.
      Begin met "📥 Zettelkast vandaag".
    context_cmd: |
      Z=/home/agent/zettelkast
      cd "$Z" 2>/dev/null || { echo "(LEESFOUT: zettelkast-clone niet gevonden)"; exit 0; }
      echo '== logregels van vandaag =='
      grep "^$(date +%F)" wiki/log.md 2>/dev/null | cut -c1-300 || true
      echo '== commits van vandaag =='
      git log --oneline --since=midnight 2>/dev/null | head -20         || echo "(LEESFOUT: git log mislukt)"
      # new_sources.py noemt elke ongeciteerde bron. Bij een URL-share is dat
      # bijna altijd het CLIPbestand terwijl de fetch-snapshot ervan allang
      # verwerkt is. Zonder deze splitsing meldt de job elke dag dezelfde
      # niet-bestaande achterstand.
      echo '== bronnen: afgehandeld vs open =='
      lijst=$(python3 scripts/new_sources.py 2>/dev/null) ||         { echo "(LEESFOUT: new_sources.py faalde)"; exit 0; }
      for f in $lijst; do
        b=$(basename "$f" .md)
        if grep -qr "$b" wiki/log.md journal/ 2>/dev/null; then
          echo "AFGEHANDELD $f"
        else
          echo "OPEN        $f :: $(grep -ohEm1 'https?://[^ ]+' "$f" 2>/dev/null | cut -c1-80)"
        fi
      done
