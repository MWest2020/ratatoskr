# Werk-overzicht: wat beweegt er, en wat zit vast.
#
# Drempels staan hier en niet in de code: hoe lang iets "te lang" in een kolom
# staat is een oordeel dat verandert, geen logica. Ouderdom is het signaal —
# dat er twaalf dingen open staan wist je al.

# Kolommen, in volgorde. `stale_days` = hierboven is het te lang blijven liggen.
# De titels zijn wat de GEBRUIKER ziet en dus Engels (ADR-0001).
columns:
  - key: proposal
    title: proposal
    stale_days: 14
  - key: building
    title: building
    stale_days: 3
  - key: review
    title: review
    stale_days: 2
  - key: merged
    title: merged
    stale_days: 0        # 0 = nooit muf; dit is de uitgang

# Waar de producent kijkt.
sources:
  # Clones op de host; elke niet-gearchiveerde change is een voorstel.
  openspec_glob: /home/agent/*/openspec/changes/*/proposal.md
  # GitHub-eigenaar voor open en recent gemergede PR's.
  github_owner: MWest2020
  # Runbestanden van werksessies (zie agents/sessies.py).
  session_runs: /tmp/boomhuis-sessies
  # PR's komen van GitHub en veranderen traag; sessies veranderen elke minuut.
  # Door de PR-kant te cachen kan de momentopname elke twee minuten draaien —
  # en dát is wat een lopende sessie zichtbaar maakt terwijl hij bouwt.
  pr_cache: /tmp/board-prs.json
  pr_cache_seconds: 600
  # Hoeveel dagen terug "gemerged" nog getoond wordt.
  merged_days: 3
  # Repo's die niet op het bord horen. Niet elk open ding is werk, en niet elk
  # open ding kún je sluiten: freelens-ai-extension is op GitHub GEARCHIVEERD,
  # dus die PR blijft open en is als oudste kaart elke dag het luidst. Een bord
  # dat iets toont wat je niet kúnt oplossen, leert je het bord te negeren.
  # Besluit Mark 2026-09-12.
  ignore_repos:
    - freelens-ai-extension
