# Work overview: what is moving, and what is stuck.
#
# The thresholds live here and not in the code: how long something is "too long"
# in a column is a judgement that changes, not logic. Age is the signal — that
# twelve things are open you already knew.

# Columns, in order. `stale_days` = above this it has been sitting too long.
# The titles are what the USER sees and are therefore English (ADR-0001).
columns:
  # Werk dat nog niet begonnen is. Een issue dat hier een maand staat is geen
  # storing -- maar wel iets dat je een keer moet bekijken in plaats van
  # eindeloos voorbij te scrollen.
  - key: backlog
    title: backlog
    stale_days: 30
  - key: proposal
    title: proposal
    stale_days: 14
  - key: building
    title: building
    stale_days: 3
  - key: review
    title: review
    stale_days: 2
  - key: merged
    title: merged
    stale_days: 0        # 0 = never stale; this is the exit

# Where the producer looks.
sources:
  # Clones on the host; every non-archived change is a proposal.
  openspec_glob: /home/agent/*/openspec/changes/*/proposal.md
  # GitHub owner for open and recently merged PRs.
  github_owner: MWest2020
  # Run files of work sessions (see agents/sessions.py).
  session_runs: /tmp/boomhuis-sessies
  # De tmux-sessies van deze host tonen. Aan op agent-lxc, waar het werk draait;
  # uit op een host waar het bord alleen een lezer is.
  tmux: true
  # PRs come from GitHub and change slowly; sessions change every minute. Caching
  # the PR side lets the snapshot run every two minutes — and that is what makes a
  # running session visible while it builds.
  pr_cache: /tmp/board-prs.json
  pr_cache_seconds: 600
  # Een runbestand dat zo lang niet meer groeide en geen resultaat heeft, hoort
  # bij een proces dat weg is. Ruim boven de langste stilte die een werkende
  # sessie kan hebben (denken tussen twee tool-aanroepen).
  session_stale_seconds: 300
  # How many days back "merged" is still shown.
  merged_days: 3
  # Repos that do not belong on the board. Not every open thing is work, and not
  # every open thing CAN be closed: freelens-ai-extension is ARCHIVED on GitHub,
  # so that PR stays open and shouts loudest every day as the oldest card. A
  # board that shows something you cannot fix teaches you to ignore the board.
  # Mark's decision, 2026-09-12.
  ignore_repos:
    - freelens-ai-extension
