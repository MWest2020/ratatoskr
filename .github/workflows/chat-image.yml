# Publiceert de ratatoskr-chat als image. Eén trigger: een tag `chat-v<versie>`.
#
# Waarom geen build op elke push naar main: een image dat vanzelf verschijnt
# verleidt tot `:latest`, en dan weet een installatie niet meer wélke boomhuis er
# draait. Een tag is een bewuste handeling en levert precies één onveranderlijke
# versie. De digest staat in de run-samenvatting; die hoort in .env, niet de tag,
# als je het echt vast wilt nagelen.
name: chat-image

on:
  push:
    tags: ["chat-v*"]
  workflow_dispatch:
    inputs:
      versie:
        description: "versie zonder chat-v-prefix, bv. 0.1.0-rc1"
        required: true

# Actions op commit-SHA, niet op een tag: een tag kan verplaatst worden en dan
# draait er andere code in een job die naar ghcr mag publiceren. De `# v4` erachter
# is voor mensen; de SHA is wat telt. `scripts/pin_check.py` bewaakt dit.
permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Versie en naam bepalen
        id: v
        run: |
          if [ -n "${{ inputs.versie }}" ]; then
            echo "versie=${{ inputs.versie }}" >> "$GITHUB_OUTPUT"
          else
            echo "versie=${GITHUB_REF_NAME#chat-v}" >> "$GITHUB_OUTPUT"
          fi
          # Een image-repository MOET kleine letters zijn; de eigenaar heet
          # MWest2020. Zonder deze regel faalt de build op "repository name must
          # be lowercase" — gemeten bij de eerste publicatie.
          echo "eigenaar=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Bouwen en publiceren
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: chat/Dockerfile
          push: true
          # Geen `latest`. Twee tags: de versie, en de commit — zodat je van een
          # draaiende container altijd terug kunt naar de broncode.
          tags: |
            ghcr.io/${{ steps.v.outputs.eigenaar }}/ratatoskr-chat:${{ steps.v.outputs.versie }}
            ghcr.io/${{ steps.v.outputs.eigenaar }}/ratatoskr-chat:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Samenvatting
        run: |
          {
            echo "### ratatoskr-chat ${{ steps.v.outputs.versie }}"
            echo
            echo '```'
            echo "CHAT_IMAGE=ghcr.io/${{ steps.v.outputs.eigenaar }}/ratatoskr-chat:${{ steps.v.outputs.versie }}"
            echo "digest: ${{ steps.build.outputs.digest }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
