<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#15130f">
<title>Boomhuis</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Boomhuis">
<style>
  :root{
    --bg:#15130f; --panel:#1e1b16; --panel2:#26221b; --line:#332d24;
    --ink:#f0ead9; --muted:#a79a83; --accent:#d8a657; --accent2:#7daea3;
    --mine:#3a3324; --other:#221f19; --danger:#e06c5b;
    --radius:14px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{
    background:var(--bg); color:var(--ink);
    font-family:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    display:flex; flex-direction:column; height:100dvh; overflow:hidden;
  }
  header{
    display:flex; align-items:center; gap:.6rem; padding:.7rem .9rem;
    padding-top:calc(.7rem + env(safe-area-inset-top));
    background:var(--panel); border-bottom:1px solid var(--line); flex:0 0 auto;
  }
  header .bee{font-size:1.2rem}
  header h1{font-size:1.02rem; margin:0; font-weight:700; letter-spacing:.01em}
  header h1 .hash{color:var(--accent)}
  header button{
    margin-left:auto; background:var(--panel2); color:var(--ink);
    border:1px solid var(--line); border-radius:10px; padding:.4rem .7rem;
    font-size:.85rem; font-weight:600;
  }
  /* kanaallade */
  #drawer{
    position:absolute; inset:0; background:rgba(0,0,0,.55); z-index:20;
    display:none; opacity:0; transition:opacity .15s;
  }
  #drawer.open{display:block; opacity:1}
  #drawer .sheet{
    position:absolute; top:0; left:0; bottom:0; width:min(78vw,320px);
    background:var(--panel); border-right:1px solid var(--line);
    padding:calc(.9rem + env(safe-area-inset-top)) .6rem .9rem; overflow-y:auto;
    transform:translateX(-100%); transition:transform .18s;
  }
  #drawer.open .sheet{transform:none}
  #drawer .title{color:var(--muted); font-size:.72rem; text-transform:uppercase;
    letter-spacing:.1em; padding:.2rem .7rem .5rem}
  .chan{
    display:flex; align-items:center; gap:.5rem; width:100%; text-align:left;
    background:none; border:none; color:var(--ink); font-size:1rem;
    padding:.7rem .7rem; border-radius:10px; font-weight:600;
  }
  .chan:hover,.chan.active{background:var(--panel2)}
  .chan .hash{color:var(--accent)}
  .chan.active .hash{color:var(--accent)}
  .chan .del{margin-left:auto; background:none; border:none; color:var(--muted);
    font-size:.9rem; padding:.2rem .4rem; border-radius:8px; opacity:.5}
  .chan .del:hover{opacity:1; color:var(--danger); background:var(--panel2)}
  .newchan{display:flex; gap:.4rem; padding:.6rem .3rem 0}
  .newchan input{flex:1; background:var(--panel2); color:var(--ink);
    border:1px solid var(--line); border-radius:10px; padding:.5rem .6rem; font:inherit}
  .newchan button{background:var(--accent); color:#1a1710; border:none;
    border-radius:10px; padding:0 .9rem; font-weight:800; font-size:1.1rem}
  /* berichten */
  #msgs{flex:1 1 auto; overflow-y:auto; padding:.8rem .8rem 1rem;
    display:flex; flex-direction:column; gap:.55rem}
  .row{display:flex; flex-direction:column; max-width:82%}
  .row.mine{align-self:flex-end; align-items:flex-end}
  .meta{font-size:.7rem; color:var(--muted); margin:0 .3rem .12rem;
    font-family:"IBM Plex Mono",ui-monospace,monospace}
  .bubble{
    background:var(--other); border:1px solid var(--line);
    padding:.5rem .7rem; border-radius:var(--radius); font-size:.96rem;
    line-height:1.35; white-space:pre-wrap; word-break:break-word;
  }
  .row.mine .bubble{background:var(--mine); border-color:#463c29}
  .author-mark{color:var(--accent)}
  .author-orchestrator{color:var(--accent2)}
  .empty{color:var(--muted); text-align:center; margin:auto; font-size:.9rem}
  /* agents-lade */
  #agentsDrawer{position:absolute; inset:0; background:rgba(0,0,0,.55); z-index:20;
    display:none; opacity:0; transition:opacity .15s}
  #agentsDrawer.open{display:block; opacity:1}
  #agentsDrawer .sheet{position:absolute; top:0; right:0; bottom:0; left:auto;
    width:min(82vw,340px); background:var(--panel); border-left:1px solid var(--line);
    border-right:none; transform:translateX(100%)}
  #agentsDrawer.open .sheet{transform:none}
  .agent{background:var(--panel2); border:1px solid var(--line); border-radius:12px;
    padding:.6rem .7rem; margin:.35rem .3rem}
  .agent .nm{font-weight:700; color:var(--accent2)}
  .agent .nm::before{content:"@"}
  .agent .rol{color:var(--muted); font-size:.8rem; margin:.1rem 0 .45rem}
  .agent .chips{display:flex; flex-wrap:wrap; gap:.35rem}
  .agent .chip{font-family:"IBM Plex Mono",monospace; font-size:.72rem; cursor:pointer;
    background:var(--other); border:1px solid var(--line); color:var(--ink);
    border-radius:999px; padding:.15rem .55rem}
  .agent .chip::before{content:"#"; color:var(--accent)}
  .agent .none{color:var(--muted); font-size:.78rem; font-style:italic}
  .agenthint{color:var(--muted); font-size:.78rem; padding:.7rem; line-height:1.4}
  /* invoer */
  form{
    flex:0 0 auto; display:flex; gap:.5rem; padding:.6rem .7rem;
    padding-bottom:calc(.6rem + env(safe-area-inset-bottom));
    background:var(--panel); border-top:1px solid var(--line);
  }
  textarea{
    flex:1; resize:none; background:var(--panel2); color:var(--ink);
    border:1px solid var(--line); border-radius:12px; padding:.6rem .7rem;
    font:inherit; font-size:1rem; max-height:120px; min-height:44px;
  }
  form button{
    background:var(--accent); color:#1a1710; border:none; border-radius:12px;
    padding:0 1rem; font-weight:800; font-size:.95rem;
  }
  form button:disabled{opacity:.5}
  .toast{position:absolute; bottom:5rem; left:50%; transform:translateX(-50%);
    background:var(--danger); color:#1a1710; padding:.4rem .8rem; border-radius:10px;
    font-size:.85rem; font-weight:700; z-index:30; display:none}
  /* repo/PR-view */
  .rrow{padding:.6rem .7rem; border:1px solid var(--line); border-radius:12px;
    margin-bottom:.5rem; background:var(--panel2); cursor:pointer}
  .rrow:active{background:var(--other)}
  .rrow .rn{font-weight:700}
  .rrow .rn .own{color:var(--muted); font-weight:400}
  .rrow .rd{color:var(--muted); font-size:.8rem; margin-top:.15rem; line-height:1.35}
  .rrow .badge{float:right; font-family:"IBM Plex Mono",monospace; font-size:.72rem;
    background:var(--mine); border-radius:999px; padding:.1rem .5rem; color:var(--accent)}
  .rback{color:var(--accent2); font-size:.85rem; cursor:pointer; margin-bottom:.5rem;
    display:inline-block; font-weight:600}
  .prdet .st{color:var(--muted); font-size:.82rem; margin:.2rem 0 .5rem}
  .prdet .add{color:#8ecf8e} .prdet .del{color:var(--danger)}
  .prdet .file{font-family:"IBM Plex Mono",monospace; font-size:.76rem; padding:.2rem 0;
    border-bottom:1px solid var(--line); word-break:break-all}
  .rrow .rev, .prdet .rev{background:var(--accent); color:#15130f; border:0;
    border-radius:10px; padding:.4rem .7rem; font-weight:700; font-size:.82rem; margin-top:.6rem}
  .prdet a.gh{color:var(--accent2); font-size:.85rem; word-break:break-all}
  /* pinned context */
  #pinned{flex:0 0 auto; background:var(--panel2); border-bottom:1px solid var(--line);
    padding:.5rem .8rem; font-size:.85rem; color:var(--ink)}
  #pinned .head{display:flex; align-items:center; gap:.4rem; cursor:pointer; font-weight:700}
  #pinned .head .pin{color:var(--accent)}
  #pinned .head .caret{margin-left:auto; color:var(--muted); font-size:.8rem}
  #pinned .body{margin-top:.4rem; max-height:9rem; overflow:auto; white-space:pre-wrap;
    color:var(--muted); line-height:1.4; font-size:.82rem}
  #pinned.collapsed .body{display:none}
  /* ongelezen-badge in de kanaallijst */
  .chan .unread{margin-left:auto; background:var(--accent); color:#15130f;
    font-size:.72rem; font-weight:800; min-width:1.25rem; height:1.25rem;
    border-radius:999px; display:inline-flex; align-items:center;
    justify-content:center; padding:0 .35rem}
</style>
</head>
<body>
  <header>
    <span class="bee">🐝</span>
    <h1><span class="hash">#</span><span id="chanName">runs</span></h1>
    <button id="reposBtn">📦 Repos</button>
    <button id="agentsBtn">🤖 Agents</button>
    <button id="switch">Kanalen</button>
  </header>

  <div id="drawer"><div class="sheet">
    <div class="title">Boomhuis · kanalen</div>
    <div id="chanList"></div>
    <form id="newChan" class="newchan">
      <input id="newChanName" placeholder="nieuw kanaal…" autocomplete="off"
             maxlength="31" pattern="[a-z0-9][a-z0-9_-]*">
      <button type="submit">+</button>
    </form>
  </div></div>

  <div id="agentsDrawer"><div class="sheet">
    <div class="title">Agents · wie zit waar</div>
    <div id="agentList"></div>
    <div class="agenthint">Noem een agent met <b>@naam</b> in een kanaal om te praten.
      Meer agents (architect, marketing…) volgen — elk met eigen rol.</div>
  </div></div>

  <div id="reposDrawer"><div class="sheet">
    <div class="title" id="repoTitle">Repo's · GitHub</div>
    <div id="repoView"><div class="agenthint">laden…</div></div>
  </div></div>

  <div id="pinned" hidden></div>

  <div id="msgs"><div class="empty">laden…</div></div>

  <form id="composer">
    <textarea id="input" rows="1" placeholder="Bericht aan het kanaal…" autocomplete="off"></textarea>
    <button type="submit" id="send">➤</button>
  </form>

  <div class="toast" id="toast"></div>

<script>
const $ = s => document.querySelector(s);
let channels = [], current = null, lastCount = 0, pollTimer = null;

function toast(t){ const e=$("#toast"); e.textContent=t; e.style.display="block";
  setTimeout(()=>e.style.display="none", 2600); }

// --- ongelezen-teller per kanaal (per device via localStorage) ---
let overview = {}; // id -> {count, latest}
function seenMap(){ try{ return JSON.parse(localStorage.getItem("bh_seen")||"{}"); }catch(e){ return {}; } }
function markSeen(id, count){ const m=seenMap(); m[id]=count;
  try{ localStorage.setItem("bh_seen", JSON.stringify(m)); }catch(e){} }
function unreadFor(id){ const o=overview[id]; if(!o) return 0;
  const s=seenMap()[id]; if(s==null) return 0; return Math.max(0, o.count - s); }
function renderBadges(){
  document.querySelectorAll("#chanList .chan").forEach(row=>{
    const b=row.querySelector(".unread"); if(!b) return;
    const n=(current&&row.dataset.id===current.id)?0:unreadFor(row.dataset.id);
    if(n>0){ b.textContent=n>99?"99+":n; b.hidden=false; } else { b.hidden=true; }
  });
}
async function loadOverview(){
  try{ const d=await (await fetch("/api/overview")).json();
    overview={};
    const sm=seenMap(); let changed=false;
    for(const c of (d.channels||[])){
      overview[c.id]={count:c.count, latest:c.latest};
      if(sm[c.id]==null){ sm[c.id]=c.count; changed=true; } // baseline: nog nooit geopend → nu gelezen
    }
    if(changed){ try{ localStorage.setItem("bh_seen", JSON.stringify(sm)); }catch(e){} }
    renderBadges();
  }catch(e){}
}

async function loadChannels(){
  channels = await (await fetch("/api/channels")).json();
  const wrap = $("#chanList"); wrap.innerHTML="";
  for(const c of channels){
    const row=document.createElement("div");
    row.className="chan"+(current&&c.id===current.id?" active":"");
    row.dataset.id=c.id;
    row.innerHTML=`<span class="hash">#</span><span class="cn">${c.name}</span><span class="unread" hidden></span>`;
    row.querySelector(".cn").onclick=()=>{ selectChannel(c); closeDrawer(); };
    row.querySelector(".hash").onclick=()=>{ selectChannel(c); closeDrawer(); };
    if(c.name!=="general"){
      const del=document.createElement("button");
      del.className="del"; del.textContent="🗑"; del.title="verwijder #"+c.name;
      del.onclick=async(e)=>{ e.stopPropagation();
        if(!confirm("Kanaal #"+c.name+" verwijderen?")) return;
        const r=await fetch("/api/channels/delete",{method:"POST",
          headers:{"Content-Type":"application/json"},body:JSON.stringify({channel:c.id})});
        const j=await r.json().catch(()=>({}));
        if(!r.ok||j.error){ toast(j.error||"verwijderen mislukt"); return; }
        if(current&&current.id===c.id){ current=null; $("#msgs").innerHTML='<div class="empty">kies een kanaal</div>'; }
        await loadChannels();
      };
      row.appendChild(del);
    }
    wrap.appendChild(row);
  }
  renderBadges();
}
async function createChannel(name){
  const r=await fetch("/api/channels/create",{method:"POST",
    headers:{"Content-Type":"application/json"},body:JSON.stringify({name})});
  const j=await r.json().catch(()=>({}));
  if(!r.ok||j.error){ toast(j.error||"aanmaken mislukt"); return false; }
  await loadChannels();
  const c=channels.find(x=>x.name===name); if(c) selectChannel(c);
  return true;
}
function selectChannel(c){
  current=c; lastCount=0; $("#chanName").textContent=c.name;
  $("#msgs").innerHTML='<div class="empty">laden…</div>';
  loadPinned(c.name);
  refresh(true);
}
async function loadPinned(name){
  const el=$("#pinned");
  let content="";
  try{ const d=await (await fetch("/api/pinned?channel="+encodeURIComponent(name))).json();
    content=(d.content||"").trim(); }catch(e){ content=""; }
  if(!content){ el.hidden=true; el.innerHTML=""; return; }
  const lines=content.split("\n");
  let title="Vastgezette context", body=content;
  if(lines[0] && lines[0].startsWith("#")){
    title=lines[0].replace(/^#+\s*/,"").replace(/^📌\s*/,"");
    body=lines.slice(1).join("\n").replace(/^>.*$/gm,"").trim();
  }
  el.hidden=false; el.classList.add("collapsed");
  el.innerHTML='<div class="head"><span class="pin">📌</span><span class="ttl"></span>'+
    '<span class="caret">▸</span></div><div class="body"></div>';
  el.querySelector(".ttl").textContent=title;
  el.querySelector(".body").textContent=body;
  el.querySelector(".head").onclick=()=>{ el.classList.toggle("collapsed");
    el.querySelector(".caret").textContent=el.classList.contains("collapsed")?"▸":"▾"; };
}
const fmtTime = ts => { const d=new Date(ts*1000);
  return d.toLocaleString("nl-NL",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}); };

async function refresh(force){
  if(!current) return;
  let data;
  try{ data = await (await fetch("/api/messages?channel="+current.id)).json(); }
  catch(e){ return; }
  if(data.error){ return; }
  const box=$("#msgs");
  const near = box.scrollHeight - box.scrollTop - box.clientHeight < 120;
  const msgs=data.messages||[];
  if(!force && msgs.length===lastCount) return;
  lastCount=msgs.length;
  if(current){ markSeen(current.id, msgs.length); renderBadges(); }
  if(msgs.length===0){ box.innerHTML='<div class="empty">Nog geen berichten — begin het gesprek.</div>'; return; }
  box.innerHTML="";
  for(const m of msgs){
    const row=document.createElement("div");
    row.className="row"+(m.mine?" mine":"");
    const cls = m.author==="mark"?"author-mark":(m.author==="orchestrator"?"author-orchestrator":"");
    row.innerHTML=`<div class="meta"><span class="${cls}">${m.author}</span> · ${fmtTime(m.ts)}</div>`+
      `<div class="bubble"></div>`;
    row.querySelector(".bubble").textContent=m.content;
    box.appendChild(row);
  }
  if(force||near) box.scrollTop=box.scrollHeight;
}

async function send(text){
  const r = await fetch("/api/send",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({channel:current.id, content:text})});
  const j = await r.json().catch(()=>({}));
  if(!r.ok||j.error){ toast(j.error||"versturen mislukt"); return false; }
  return true;
}

async function loadAgents(){
  let data;
  try{ data=await (await fetch("/api/agents")).json(); }catch(e){ return; }
  const wrap=$("#agentList"); wrap.innerHTML="";
  for(const a of (data.agents||[])){
    const el=document.createElement("div"); el.className="agent";
    const chips=(a.channels||[]).length
      ? `<div class="chips">${a.channels.map(c=>`<span class="chip" data-c="${c}">${c}</span>`).join("")}</div>`
      : `<div class="none">in geen enkel kanaal</div>`;
    el.innerHTML=`<div class="nm">${a.handle}</div><div class="rol">${a.rol||""}</div>${chips}`;
    el.querySelectorAll(".chip").forEach(ch=>ch.onclick=()=>{
      const c=channels.find(x=>x.name===ch.dataset.c);
      if(c){ selectChannel(c); closeAgents();
        input.value="@"+a.handle+" "; input.focus(); }
    });
    wrap.appendChild(el);
  }
}
function closeAgents(){ $("#agentsDrawer").classList.remove("open"); }
function closeRepos(){ $("#reposDrawer").classList.remove("open"); }

async function sendTo(channelName, text){
  const c = channels.find(x=>x.name===channelName);
  if(!c){ toast("kanaal #"+channelName+" bestaat niet"); return false; }
  const r = await fetch("/api/send",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({channel:c.id, content:text})});
  const j = await r.json().catch(()=>({}));
  if(!r.ok||j.error){ toast(j.error||"versturen mislukt"); return false; }
  return true;
}
async function reviewPR(repo, num, title, url){
  const ok = await sendTo("review", `@reviewer bekijk PR ${repo}#${num} — ${title}\n${url}`);
  if(ok){ closeRepos(); const c=channels.find(x=>x.name==="review");
    if(c) selectChannel(c); toast("review aangevraagd in #review"); }
}
async function openRepos(){
  $("#repoTitle").textContent="Repo's · GitHub";
  const view=$("#repoView"); view.innerHTML='<div class="agenthint">laden…</div>';
  $("#reposDrawer").classList.add("open");
  let d; try{ d=await (await fetch("/api/repos")).json(); }
  catch(e){ view.innerHTML='<div class="agenthint">GitHub onbereikbaar.</div>'; return; }
  if(d.error){ view.innerHTML=`<div class="agenthint">${d.error}</div>`; return; }
  view.innerHTML="";
  for(const r of (d.repos||[])){
    const el=document.createElement("div"); el.className="rrow";
    const [own,nm]=r.full_name.split("/");
    el.innerHTML=`<span class="badge">${r.open_issues} open</span>`+
      `<div class="rn"><span class="own">${own}/</span>${nm}${r.private?" 🔒":""}</div>`+
      `<div class="rd">${r.description||"—"}</div>`;
    el.onclick=()=>showRepo(r.full_name);
    view.appendChild(el);
  }
}
async function showRepo(full){
  $("#repoTitle").textContent=full;
  const view=$("#repoView");
  view.innerHTML='<span class="rback">← repo\'s</span><div class="agenthint">PR\'s laden…</div>';
  view.querySelector(".rback").onclick=openRepos;
  let d; try{ d=await (await fetch("/api/prs?repo="+encodeURIComponent(full))).json(); }
  catch(e){ return; }
  const back='<span class="rback">← repo\'s</span>';
  if(d.error){ view.innerHTML=back+`<div class="agenthint">${d.error}</div>`; view.querySelector(".rback").onclick=openRepos; return; }
  const prs=d.prs||[];
  view.innerHTML=back+(prs.length?"":'<div class="agenthint">Geen open PR\'s.</div>');
  view.querySelector(".rback").onclick=openRepos;
  for(const p of prs){
    const el=document.createElement("div"); el.className="rrow";
    el.innerHTML=`<span class="badge">#${p.number}</span>`+
      `<div class="rn">${p.title}${p.draft?" · concept":""}</div>`+
      `<div class="rd">${p.head} → ${p.base} · door ${p.author}</div>`;
    el.onclick=()=>showPR(full, p.number);
    view.appendChild(el);
  }
}
async function showPR(repo, num){
  const view=$("#repoView");
  view.innerHTML='<span class="rback">← PR\'s</span><div class="agenthint">laden…</div>';
  view.querySelector(".rback").onclick=()=>showRepo(repo);
  let p; try{ p=await (await fetch(`/api/pr?repo=${encodeURIComponent(repo)}&num=${num}`)).json(); }
  catch(e){ return; }
  if(p.error){ view.innerHTML=`<span class="rback">← PR's</span><div class="agenthint">${p.error}</div>`;
    view.querySelector(".rback").onclick=()=>showRepo(repo); return; }
  const files=(p.files||[]).map(f=>`<div class="file">${f.status[0].toUpperCase()} ${f.filename} `+
    `<span class="add">+${f.additions}</span> <span class="del">−${f.deletions}</span></div>`).join("");
  const d=document.createElement("div"); d.className="prdet";
  d.innerHTML=`<span class="rback">← PR\'s</span>`+
    `<div class="rn" style="margin:.3rem 0">#${p.number} · ${p.title}</div>`+
    `<div class="st">${p.head} → ${p.base} · door ${p.author} · `+
    `<span class="add">+${p.additions}</span> <span class="del">−${p.deletions}</span> in ${p.changed_files} bestanden</div>`+
    `${files}`+
    `<div style="margin-top:.6rem"><a class="gh" href="${p.url}" target="_blank" rel="noopener">op GitHub openen ↗</a></div>`+
    `<button class="rev">🔍 Laat @reviewer kijken</button>`;
  view.innerHTML=""; view.appendChild(d);
  d.querySelector(".rback").onclick=()=>showRepo(repo);
  d.querySelector(".rev").onclick=()=>reviewPR(repo, p.number, p.title, p.url);
}

// UI-bindings
$("#switch").onclick=()=>$("#drawer").classList.add("open");
$("#agentsBtn").onclick=()=>{ loadAgents(); $("#agentsDrawer").classList.add("open"); };
$("#reposBtn").onclick=openRepos;
$("#reposDrawer").onclick=e=>{ if(e.target.id==="reposDrawer") closeRepos(); };
$("#newChan").addEventListener("submit", async e=>{
  e.preventDefault();
  const inp=$("#newChanName"); const name=(inp.value||"").trim().toLowerCase();
  if(!name) return;
  if(await createChannel(name)){ inp.value=""; closeDrawer(); }
});
$("#agentsDrawer").onclick=e=>{ if(e.target.id==="agentsDrawer") closeAgents(); };
$("#drawer").onclick=e=>{ if(e.target.id==="drawer") closeDrawer(); };
function closeDrawer(){ $("#drawer").classList.remove("open"); }
const input=$("#input");
input.addEventListener("input",()=>{ input.style.height="auto";
  input.style.height=Math.min(input.scrollHeight,120)+"px"; });
$("#composer").addEventListener("submit", async e=>{
  e.preventDefault();
  const t=input.value.trim(); if(!t||!current) return;
  $("#send").disabled=true;
  const ok=await send(t);
  $("#send").disabled=false;
  if(ok){ input.value=""; input.style.height="auto"; await refresh(true); }
});
input.addEventListener("keydown",e=>{
  if(e.key==="Enter"&&!e.shiftKey){ e.preventDefault(); $("#composer").requestSubmit(); }
});

(async function init(){
  await loadChannels();
  selectChannel(channels[0]);
  await loadChannels();
  loadOverview();
  pollTimer=setInterval(()=>refresh(false), 4000);
  setInterval(loadOverview, 12000);
  document.addEventListener("visibilitychange",()=>{ if(!document.hidden){ refresh(false); loadOverview(); } });
})();

// --- PWA: service worker + installeer-knop ---
if("serviceWorker" in navigator){
  navigator.serviceWorker.register("/sw.js").catch(()=>{});
}
let deferredPrompt=null;
window.addEventListener("beforeinstallprompt", e=>{
  e.preventDefault(); deferredPrompt=e;
  const b=document.createElement("button");
  b.textContent="Installeer";
  b.style.cssText="margin-left:.4rem;background:var(--accent);color:#15130f;border:0;border-radius:10px;padding:.4rem .7rem;font-size:.85rem;font-weight:700";
  b.onclick=async()=>{ b.remove(); if(!deferredPrompt)return; deferredPrompt.prompt();
    await deferredPrompt.userChoice; deferredPrompt=null; };
  document.querySelector("header").appendChild(b);
});
</script>
</body>
