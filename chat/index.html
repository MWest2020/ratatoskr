<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#15130f">
<title>Ratatoskr</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ratatoskr">
<link rel="stylesheet" href="/app.css">
</head>
<body>
  <header>
    <span class="bee">🐝</span>
    <h1><span class="hash">#</span><span id="chanName">runs</span></h1>
    <button id="boardBtn">📋 Board</button>
    <button id="reposBtn">📦 Repos</button>
    <button id="agentsBtn">🤖 Agents</button>
    <button id="switch">Kanalen</button>
  </header>

  <div id="drawer"><div class="sheet">
    <div class="title">Ratatoskr · kanalen</div>
    <div id="chanList"></div>
    <form id="newChan" class="newchan">
      <input id="newChanName" placeholder="nieuw kanaal…" autocomplete="off"
             maxlength="31" pattern="[a-z0-9][a-z0-9_-]*">
      <button type="submit">+</button>
    </form>
    <div class="ladevoet">
      <span id="wieBenJe" class="agenthint"></span>
      <button id="uitnodigBtn" type="button" hidden>Iemand uitnodigen</button>
      <button id="wwBtn" type="button">Wachtwoord</button>
      <button id="uitlogBtn" type="button">Uitloggen</button>
    </div>
  </div></div>

  <div id="agentsDrawer"><div class="sheet">
    <div class="title">Wie zit waar</div>
    <div class="tabs"><button id="tabAgents" class="tab on">per agent</button><button id="tabChannels" class="tab">per kanaal</button></div>
    <div id="agentList"></div>
    <div id="channelMembers" hidden></div>
    <div class="agenthint">Noem een agent met <b>@naam</b> in een kanaal om te praten.
      "Per kanaal" toont wie er echt in een kanaal zit (agents én sessies).</div>
  </div></div>

  <div id="boardDrawer"><div class="sheet">
    <div class="dhead"><span class="title">Work in progress</span><button class="dclose" id="boardClose" title="close">✕</button></div>
    <div id="boardView"><div class="agenthint">loading…</div></div>
  </div></div>

  <div id="reposDrawer"><div class="sheet">
    <div class="dhead"><span class="title" id="repoTitle">Repo's · GitHub</span><button class="dclose" id="reposClose" title="sluiten">✕</button></div>
    <div id="repoView"><div class="agenthint">laden…</div></div>
  </div></div>

  <div id="pinned" hidden></div>

  <div id="msgs"><div class="empty">laden…</div></div>

  <form id="composer">
    <textarea id="input" rows="1" placeholder="Bericht aan het kanaal…" autocomplete="off"></textarea>
    <button type="submit" id="send">➤</button>
  </form>

  <div class="toast" id="toast"></div>

<script>
// Toetsenbord vs. invoerbalk. Op iOS verkleint het toetsenbord de VISUELE
// viewport, maar `100dvh` is een LAYOUT-eenheid en beweegt niet mee: de shell
// blijft even hoog, de invoerbalk zakt onder het toetsenbord en is weg. Mark,
// 2026-09-07: "invoerveld weer weg". Daarom spiegelen we visualViewport.height
// naar --app-h; de body gebruikt die als hoogte en krimpt dus wél mee.
// Ondergrens 200px: een onzinnige meting mag de shell nooit dichtklappen.
(function(){
  const vv = window.visualViewport;
  if(!vv) return;                                   // geen support -> 100dvh blijft
  const sync = ()=>{ const h = vv.height;
    if(h > 200) document.documentElement.style.setProperty("--app-h", h + "px"); };
  vv.addEventListener("resize", sync);
  vv.addEventListener("scroll", sync);
  sync();
})();
</script>
<script src="/app-cache.js"></script>
<script src="/app-verbinding.js"></script>
<script src="/app-auth.js"></script>
<script src="/app-modal.js"></script>
<script src="/app.js"></script>
<script src="/app-repos.js"></script>
<script src="/app-board.js"></script>
<script src="/app-ui.js"></script>
<script src="/app-push.js"></script>
</body>
</html>
