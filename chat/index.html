<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#15130f">
<title>Ratatoskr</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ratatoskr">
<link rel="stylesheet" href="/app.css">
<link rel="stylesheet" href="/header.css">
<link rel="stylesheet" href="/repos.css">
<link rel="stylesheet" href="/board.css">
</head>
<body>
  <header>
    <span class="bee">🐝</span>
    <h1><span class="hash">#</span><span id="chanName">runs</span></h1>
    <button id="boardBtn">📋<span class="lbl"> Board</span></button>
    <button id="reposBtn">📦<span class="lbl"> Repos</span></button>
    <button id="agentsBtn">🤖<span class="lbl"> Agents</span></button>
    <button id="switch">☰<span class="lbl"> Channels</span></button>
  </header>

  <div id="drawer"><div class="sheet">
    <div class="title">Ratatoskr · channels</div>
    <div id="chanList"></div>
    <form id="newChan" class="newchan">
      <input id="newChanName" placeholder="new channel…" autocomplete="off"
             maxlength="31" pattern="[a-z0-9][a-z0-9_-]*">
      <button type="submit">+</button>
    </form>
    <div class="drawerfoot">
      <span id="whoAmI" class="agenthint"></span>
      <button id="inviteBtn" type="button" hidden>Invite someone</button>
      <button id="passwordBtn" type="button">Password</button>
      <button id="logoutBtn" type="button">Sign out</button>
    </div>
  </div></div>

  <div id="agentsDrawer"><div class="sheet">
    <div class="title">Who is where</div>
    <div class="tabs"><button id="tabAgents" class="tab on">per agent</button><button id="tabChannels" class="tab">per channel</button></div>
    <div id="agentList"></div>
    <div id="channelMembers" hidden></div>
    <div class="agenthint">Mention an agent with <b>@name</b> in a channel to talk to it.
      "Per channel" shows who is really in a channel (agents and sessions).</div>
  </div></div>

  <div id="boardDrawer"><div class="sheet">
    <div class="dhead"><span class="title">Work in progress</span><button class="dclose" id="boardClose" title="close">✕</button></div>
    <div id="boardView"><div class="agenthint">loading…</div></div>
  </div></div>

  <div id="reposDrawer"><div class="sheet">
    <div class="dhead"><span class="title" id="repoTitle">Repos · GitHub</span><button class="dclose" id="reposClose" title="close">✕</button></div>
    <div id="repoView"><div class="agenthint">loading…</div></div>
  </div></div>

  <div id="pinned" hidden></div>

  <div id="msgs"><div class="empty">loading…</div></div>

  <form id="composer">
    <textarea id="input" rows="1" placeholder="Message to the channel…" autocomplete="off"></textarea>
    <button type="submit" id="send">➤</button>
  </form>

  <div class="toast" id="toast"></div>

<script>
// Keyboard vs. composer. On iOS the keyboard shrinks the VISUAL viewport, but
// `100dvh` is a LAYOUT unit and does not move with it: the shell stays the same
// height, the composer sinks below the keyboard and is gone. Mark, 2026-09-07:
// "invoerveld weer weg". So we mirror visualViewport.height into --app-h; the
// body uses that as its height and therefore does shrink along.
// Lower bound 200px: a nonsense measurement must never collapse the shell.
(function(){
  const vv = window.visualViewport;
  if(!vv) return;                                   // no support -> 100dvh stays
  const sync = ()=>{ const h = vv.height;
    if(h > 200) document.documentElement.style.setProperty("--app-h", h + "px"); };
  vv.addEventListener("resize", sync);
  vv.addEventListener("scroll", sync);
  sync();
})();
</script>
<script src="/app-cache.js"></script>
<script src="/app-connection.js"></script>
<script src="/app-auth.js"></script>
<script src="/app-modal.js"></script>
<script src="/app.js"></script>
<script src="/app-reply.js"></script>
<script src="/app-repos.js"></script>
<script src="/app-board.js"></script>
<script src="/app-ui.js"></script>
<script src="/app-push.js"></script>
<script src="/app-update.js"></script>
</body>
</html>
