# Ratatoskr — de hele installatie in één bestand.
#
# Herkomst: vendored van block/buzz deploy/compose/compose.yml @ 4baccd53
# (2026-08-22, https://github.com/block/buzz), met drie gesanctioneerde
# afwijkingen:
#   1. seaweedfs i.p.v. minio (openspec 2026-08-27-buzz-relay-minio-seaweedfs —
#      MinIO OSS is gearchiveerd sinds 2026-04-25);
#   2. de Ratatoskr-chat als extra service (openspec uitrol-voor-derden);
#   3. elke gepubliceerde poort krijgt een EXPLICIET bind-adres, standaard
#      127.0.0.1. Upstream publiceert "3000:3000" — dat is 0.0.0.0, gemeten met
#      `ss -ltnp` op de VM. Twee knoppen, want twee soorten publiek: BIND_ADDR
#      (chat, hoort achter een proxy of tunnel) en RELAY_BIND_ADDR (relay, waar
#      agents en andere machines rechtstreeks mee praten). Openzetten is een
#      keuze van de beheerder, geen bijwerking van de default.
# Bij een upstream-upgrade: nieuwe kopie nemen en deze drie opnieuw aanbrengen.
#
# Alles instelbaars staat in .env (zie .env.example) BEHALVE de images: die staan
# hier letterlijk. Een pin in .env staat op de host en niet in git, en dan lopen
# "wat draait er" en "wat zegt de repo" spoorloos uiteen. Een upgrade is dus een
# diff in dit bestand, en dat is precies wat je wilt kunnen zien.
# Regels: geen variabele, geen `:-fallback`, minstens major.minor.
#
#   docker compose up -d
#   docker compose exec chat python3 adminctl.py eigenaar <naam>

name: ${COMPOSE_PROJECT:-boomhuis}

services:
  relay:
    image: ghcr.io/block/buzz:sha-4baccd5
    env_file:
      - .env
    environment:
      BUZZ_BIND_ADDR: 0.0.0.0:3000
      BUZZ_HEALTH_PORT: "8080"
      BUZZ_METRICS_PORT: "9102"
      DATABASE_URL: postgres://${POSTGRES_USER:-buzz}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-buzz}
      REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD}@redis:6379
      BUZZ_S3_ENDPOINT: http://seaweedfs:8333
      # Docker DNS resolves `seaweedfs`, not arbitrary `<bucket>.seaweedfs` hosts.
      BUZZ_S3_ADDRESSING_STYLE: path
      BUZZ_S3_ACCESS_KEY: ${BUZZ_S3_ACCESS_KEY:?set BUZZ_S3_ACCESS_KEY}
      BUZZ_S3_SECRET_KEY: ${BUZZ_S3_SECRET_KEY:?set BUZZ_S3_SECRET_KEY}
      BUZZ_S3_BUCKET: ${BUZZ_S3_BUCKET:-buzz-media}
      BUZZ_GIT_REPO_PATH: /data/git
      BUZZ_AUTO_MIGRATE: ${BUZZ_AUTO_MIGRATE:-false}
      BUZZ_GIT_CONFORMANCE_PROBE: ${BUZZ_GIT_CONFORMANCE_PROBE:-true}
    ports:
      # Eigen knop, want de relay heeft een ANDER publiek dan de chat: agents
      # en andere machines praten rechtstreeks met de relay, terwijl de chat
      # achter een proxy of tunnel hoort te blijven. Beide standaard loopback —
      # van buiten de machine is er niets te bereiken tot de beheerder kiest.
      - "${RELAY_BIND_ADDR:-127.0.0.1}:${BUZZ_HTTP_PORT:-3000}:3000"
    volumes:
      - buzz-git-data:/data/git
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
      seaweedfs-init:
        condition: service_completed_successfully
    # Probe /_readiness over /dev/tcp because the runtime image has bash but no curl/wget/socat.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -ec 'exec 3<>/dev/tcp/127.0.0.1/8080; printf \"GET /_readiness HTTP/1.1\\r\\nHost: 127.0.0.1\\r\\nConnection: close\\r\\n\\r\\n\" >&3; grep -q \"200 OK\" <&3'",
        ]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    networks:
      - buzz-net

  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-buzz}
      POSTGRES_USER: ${POSTGRES_USER:-buzz}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - buzz-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    networks:
      - buzz-net

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    volumes:
      - buzz-redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped
    networks:
      - buzz-net

  # Afwijking van upstream (zie header): SeaweedFS i.p.v. MinIO.
  # Identity komt uit dezelfde BUZZ_S3_*-secrets; config wordt at-runtime
  # geschreven zodat de keys niet in `docker inspect`-args belanden.
  seaweedfs:
    image: chrislusf/seaweedfs:4.39
    environment:
      BUZZ_S3_ACCESS_KEY: ${BUZZ_S3_ACCESS_KEY:?set BUZZ_S3_ACCESS_KEY}
      BUZZ_S3_SECRET_KEY: ${BUZZ_S3_SECRET_KEY:?set BUZZ_S3_SECRET_KEY}
    entrypoint:
      - /bin/sh
      - -ec
      - >-
        printf '{"identities":[{"name":"buzz","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]}]'
        "$$BUZZ_S3_ACCESS_KEY" "$$BUZZ_S3_SECRET_KEY" > /tmp/s3_config.json &&
        printf '}' >> /tmp/s3_config.json &&
        exec weed server -s3 -s3.config=/tmp/s3_config.json -dir=/data -master.volumeSizeLimitMB=1024
    volumes:
      - buzz-seaweedfs-data:/data
    healthcheck:
      # master-poort 9333 is zonder auth; de S3-poort geeft 403 zonder creds.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9333/cluster/status"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    networks:
      - buzz-net

  seaweedfs-init:
    image: rclone/rclone:1.71
    depends_on:
      seaweedfs:
        condition: service_healthy
    environment:
      RCLONE_CONFIG_DST_TYPE: s3
      RCLONE_CONFIG_DST_PROVIDER: Other
      RCLONE_CONFIG_DST_ENDPOINT: http://seaweedfs:8333
      RCLONE_CONFIG_DST_FORCE_PATH_STYLE: "true"
      RCLONE_CONFIG_DST_ACCESS_KEY_ID: ${BUZZ_S3_ACCESS_KEY:?set BUZZ_S3_ACCESS_KEY}
      RCLONE_CONFIG_DST_SECRET_ACCESS_KEY: ${BUZZ_S3_SECRET_KEY:?set BUZZ_S3_SECRET_KEY}
    command: ["mkdir", "dst:${BUZZ_S3_BUCKET:-buzz-media}"]
    restart: "no"
    networks:
      - buzz-net

  # De chat: PWA + API. Praat met de relay over het interne netwerk (buzz-net),
  # dus hij heeft de gepubliceerde relay-poort niet nodig.
  chat:
    image: ghcr.io/mwest2020/ratatoskr-chat:0.4.0
    env_file:
      - .env
    environment:
      BIND_HOST: 0.0.0.0            # binnen de container; publiceren doet `ports`
      PORT: "8090"
      # De relay bedient communities PER HOST: een verbinding met een andere
      # Host-header dan waarop de community geconfigureerd is krijgt
      # "404 no community is configured for this host". Bij een verse installatie
      # bootstrapt de relay een community voor `relay:3000` en klopt de default.
      # Bestond de relay al (Marks installatie), dan hoort hier de host waarop
      # díe community staat — daarom instelbaar.
      BUZZ_RELAY_URL: ${BUZZ_RELAY_URL:-ws://relay:3000}
      RATATOSKR_AUTH_DB: /var/lib/ratatoskr/auth.db
      PUSH_SUBS_PATH: /var/lib/ratatoskr/push_subs.json
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${CHAT_HTTP_PORT:-8090}:8090"
    volumes:
      - ratatoskr-chat-data:/var/lib/ratatoskr
    depends_on:
      relay:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - buzz-net

volumes:
  # Staat overleeft een herinstallatie: dit zijn named volumes, geen hostpaden.
  # `docker compose down` laat ze staan; alleen `down -v` gooit ze weg.
  ratatoskr-chat-data:
    labels:
      com.buzz.volume: ratatoskr-chat
  buzz-postgres-data:
    labels:
      com.buzz.volume: postgres
  buzz-redis-data:
    labels:
      com.buzz.volume: redis
  buzz-seaweedfs-data:
    labels:
      com.buzz.volume: seaweedfs
  buzz-git-data:
    labels:
      com.buzz.volume: git

networks:
  buzz-net:
    driver: bridge
    labels:
      com.buzz.network: production
