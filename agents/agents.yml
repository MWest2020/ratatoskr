# Thin roster pointer — NOT the definition.
#
# The canonical agent definitions (mandate, chat facet/system prompt, channels,
# execution facet) live in the handbook: MWest2020/handbook ->
# docs/agents/<name>.md, MCP-readable through handbook_mcp (read_doc). The
# listener FETCHES them from there. This file only says WHICH agents this
# listener instance runs; who they are is the handbook's call. That way a bouwer
# is always the same bouwer (single source).

registry_base: https://raw.githubusercontent.com/MWest2020/handbook/main/docs/agents

run:
  - assistent
  - architect
  - bouwer
  - marketing
  - odin
  - ontwerper
  - reviewer
  - roodteam
