# The factory's limits (openspec change odin-runs-the-factory). Mark, 2026-10-22:
# "odin may build itself. My repos, whenever possible or when it makes sense,
# openspecced, consulted". The listener enforces this file; odin cannot widen it.
owner: MWest2020
# Repositories odin may start a habitat build on. alma is not a repository and
# is never a target; production lives outside this list on purpose.
repos: [ratatoskr, handbook, wordsworth, habitat, skill-forge, Wanderer, zettelkast, Gitsweeper]
builds_per_day: 6
max_concurrent: 1            # one chain at a time: four Jobs and Mark's quota
habitat_dir: /home/agent/habitat
worker_image: ghcr.io/mwest2020/habitat-worker:e01d0692e7389ecd69b2ab90752bedb9bd4f1441
kubectl: ssh -o BatchMode=yes jumpy kubectl
logdir: ~/.local/state/habitat/run-logs
runs: ~/.local/state/ratatoskr/builds
