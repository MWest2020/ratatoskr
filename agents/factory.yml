# The factory's limits (openspec change odin-runs-the-factory). Mark, 2026-10-22:
# "odin may build itself. My repos, whenever possible or when it makes sense,
# openspecced, consulted". The listener enforces this file; odin cannot widen it.
owner: MWest2020
# Repositories odin may start a habitat build on. alma is not a repository and
# is never a target; production lives outside this list on purpose.
repos: [ratatoskr, handbook, wordsworth, habitat, skill-forge, Wanderer, zettelkast, Gitsweeper, convergence]
# Readable by every chat agent as .repos/<name>/ (agents/repo_read.py). Its own
# list: a private repository is never readable by accident.
readable: [ratatoskr, handbook, wordsworth, habitat, convergence]
# GitHub boards that follow the factory's stages (agents/board.py)
boards: {wordsworth: 1, convergence: 2, ratatoskr: 3}
# API credits (agents/credits.py): these repos bill chats, proposals and builds
# to Mark's API key instead of his subscription, guarded by money, not a day cap.
api_repos: []                # 2026-10-27: convergence builds on the subscription again; the credit
                             # left ($13.38 of ledger room) no longer fits a chain's $14 reserve.
api_budget_usd: 122          # a month, in LEDGER dollars; the Console is the truth. 2026-10-26:
                             # Console $25 left, ledger at $101.35, so 101 + 21 stops with ~$4 left.
api_max_budget_usd: 2        # per reviewing habitat role (max seen: $1.53; architect on opus $1.06,
                             # 2026-10-26). 2 makes a chain reserve $14, not $17.
api_builder_budget_usd: 8    # the builder's own (demo-slice builder: $5.41)
max_builds_per_change_day: 3 # circuit breaker: then split the change, do not loop
max_concurrent_api: 3        # billed chains side by side ("Nitro", Mark 2026-10-24)
builds_per_day: 6
# Budget per habitat role run (HABITAT_MAX_BUDGET_USD). $5 was too tight for a
# real change: wordsworth ingest-records-source's builder hit it at 86 turns
# (2026-10-23). Mark has room for it ("$100 credits each month").
max_budget_usd: 15
max_concurrent: 1            # one chain at a time: four Jobs and Mark's quota
habitat_dir: /home/agent/habitat
worker_image: ghcr.io/mwest2020/habitat-worker:ef0b4ef47b902c4a8c6e5a17651b4a71961d6ca9
# The handbook commit every role seed is read from (habitat #44, handbook #35):
# one source of the roles for every project. Move it to roll out a role change.
handbook_ref: 3e0d0a1de837428d3af595330778f26d1f865344
kubectl: ssh -o BatchMode=yes jumpy kubectl
logdir: ~/.local/state/habitat/run-logs
runs: ~/.local/state/ratatoskr/builds

# Phase 3: after a merge, deploy to the HOMELAB through GitOps (agents/deploy.py).
# alma is production and is not in any recipe; deploy.safe_paths refuses a
# manifest outside cluster-config/infra/ or one that names alma.
homelab:
  repo_dir: /home/agent/homelab
  worktree: ~/.worktrees/homelab-deploy
  kubectl: ssh -o BatchMode=yes jumpy kubectl
deploy:
  wordsworth:
    package: wordsworth                       # ghcr container package
    image: ghcr.io/mwest2020/wordsworth
    manifests:                                # bumped TOGETHER, always
      - cluster-config/infra/wordsworth/api.yaml
      - cluster-config/infra/wordsworth/init-job.yaml
    app: wordsworth                           # ArgoCD Application
    namespace: wordsworth
    deployment: wordsworth-api
  convergence:
    images:                                   # one CI run builds both; deployed together
      - {package: convergence-server, image: ghcr.io/mwest2020/convergence-server}
      - {package: convergence-web, image: ghcr.io/mwest2020/convergence-web}
    manifests:
      - cluster-config/infra/convergence/deployment.yaml
    app: convergence
    namespace: convergence
    deployment: convergence
